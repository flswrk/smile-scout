<title>Smile Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Apple-style tokens: neutral surfaces, blue only for actions */
:root{
  --surface-100:#F5F5F7;--surface-200:#FFFFFF;--surface-300:#E8E8ED;--ink:#1D1D1F;--ink-muted:#6E6E73;
  --brand:#0071E3;--on-brand:#FFFFFF;--brand-tint:#E8F1FC;--link:#0066CC;--accent:#B4470A;--accent-tint:#FFF2E5;
  --success:#1E7D34;--danger:#D70015;--danger-tint:#FFE8EA;--hairline:#D2D2D7;
  --shadow-sheet:0 -4px 24px rgba(0,0,0,0.12);--shadow-focus:0 0 0 3px rgba(0,113,227,0.35);
  --scrim:rgba(0,0,0,0.4);--cool:#0A84B8;--plum:#7B5FD0;--neutral:#8E8E93;--tag-bg:#F7C1C1;--tag-line:#E24B4A;--tag-ink:#791F1F;color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --surface-100:#000000;--surface-200:#1D1D1F;--surface-300:#2C2C2E;--ink:#F5F5F7;--ink-muted:#A1A1A6;
    --brand:#2997FF;--on-brand:#000000;--brand-tint:#0F2A44;--link:#2997FF;--accent:#FFB340;--accent-tint:#33260F;
    --success:#32D74B;--danger:#FF6961;--danger-tint:#3A1517;--hairline:#38383A;
    --shadow-sheet:0 -4px 24px rgba(0,0,0,0.6);--shadow-focus:0 0 0 3px rgba(41,151,255,0.5);--scrim:rgba(0,0,0,0.6);--cool:#5AC8FA;--plum:#9B86E6;--neutral:#8E8E93;--tag-bg:#791F1F;--tag-line:#E24B4A;--tag-ink:#F7C1C1;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --surface-100:#000000;--surface-200:#1D1D1F;--surface-300:#2C2C2E;--ink:#F5F5F7;--ink-muted:#A1A1A6;
  --brand:#2997FF;--on-brand:#000000;--brand-tint:#0F2A44;--link:#2997FF;--accent:#FFB340;--accent-tint:#33260F;
  --success:#32D74B;--danger:#FF6961;--danger-tint:#3A1517;--hairline:#38383A;
  --shadow-sheet:0 -4px 24px rgba(0,0,0,0.6);--shadow-focus:0 0 0 3px rgba(41,151,255,0.5);--scrim:rgba(0,0,0,0.6);--cool:#5AC8FA;--plum:#9B86E6;--neutral:#8E8E93;--tag-bg:#791F1F;--tag-line:#E24B4A;--tag-ink:#F7C1C1;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--surface-300);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-size:15px;line-height:22px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface-100);z-index:30}
h1,h2,h3,p{margin:0}
h1{font-size:30px;line-height:36px;font-weight:600;letter-spacing:-.02em}
h2{font-size:21px;line-height:27px;font-weight:600;letter-spacing:-.01em}
h3{font-size:15px;line-height:22px;font-weight:600}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--surface-100);display:flex;flex-direction:column;border-left:1px solid var(--hairline);border-right:1px solid var(--hairline);padding-top:env(safe-area-inset-top,0px)}
#screen{flex:1;display:flex;flex-direction:column;min-width:0}
.pad{padding:16px}
.head{padding:16px 16px 8px;display:flex;flex-direction:column;gap:4px}
.head .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.body{padding:8px 16px 24px;display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--ink-muted)}
.small{font-size:13px;line-height:18px}
.cap{font-size:12px;line-height:16px}
.b{font-weight:600}
.bb{font-weight:700}
.num{font-variant-numeric:tabular-nums}
.price{font-size:24px;line-height:28px;font-weight:700;font-variant-numeric:tabular-nums}
.struck{text-decoration:line-through}
.card{background:var(--surface-200);border:0;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.tile{cursor:pointer;text-align:left}
.sec{background:var(--surface-200);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sec .sh{font-size:13px;line-height:18px;font-weight:500;color:var(--ink-muted)}
.savebar{position:sticky;bottom:64px;z-index:15;padding:10px 16px 12px;background:color-mix(in srgb,var(--surface-200) 90%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:0.5px solid var(--hairline);display:flex;flex-direction:column;gap:8px}
.mx{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;line-height:18px}
.mx th,.mx td{padding:8px 10px;border-bottom:0.5px solid var(--hairline);vertical-align:top;text-align:left}
.mx thead th{background:var(--surface-200);font-weight:600}
.mx .bh{text-align:center;background:var(--surface-300);border-left:0.5px solid var(--hairline);font-size:14px}
.mx .ph{text-align:center;border-left:0.5px solid var(--hairline)}
.mx td.c{border-left:0.5px solid var(--hairline);min-width:150px}
.mx th.rl,.mx td.rl{position:sticky;left:0;z-index:1;background:var(--surface-200);min-width:300px;font-weight:500}
.mx tr.diff td{background:color-mix(in srgb,var(--brand) 8%,var(--surface-200))}
.mx tr.secrow td{background:var(--surface-300);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted)}
.mx .rec{display:block;color:var(--link);font-size:11px;font-weight:700}
.mx input.cell{min-height:34px;border-radius:8px;padding:0 8px;text-align:center;font-size:12.5px;font-weight:600}
.mx input.sum{font-weight:400;font-size:12px;color:var(--ink-muted);background:transparent;border:1px dashed var(--hairline)}
.mx input.rn{min-height:34px;font-size:13px;background:transparent;padding:0 6px}
.mx input.cell.ty{background:color-mix(in srgb,var(--success) 18%,var(--surface-200));color:var(--success)}
.mx input.cell.tn{background:color-mix(in srgb,var(--danger) 14%,var(--surface-200));color:var(--danger)}
.mx input.cell.tw{background:color-mix(in srgb,var(--accent) 16%,var(--surface-200));color:var(--accent)}
.mx input.cell.to{background:var(--surface-300)}
.mx input.cell.t0{background:transparent;border:1px dashed var(--hairline)}
.mx textarea.exa{field-sizing:content;min-height:56px;resize:none;font-size:12.5px;line-height:17px;padding:6px 8px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar .grow{min-width:200px}
.dt-wrap{background:var(--surface-200);border-radius:18px;overflow:auto;max-width:100%}
table.dt{width:100%;border-collapse:collapse;font-size:13px;line-height:18px;min-width:640px}
table.dt th{position:sticky;top:0;background:var(--surface-200);text-align:left;font-size:12px;font-weight:600;color:var(--ink-muted);border-bottom:1px solid var(--hairline);padding:0}
table.dt .thb{border:0;background:transparent;color:inherit;font:inherit;font-weight:600;padding:12px 14px;width:100%;text-align:left;white-space:nowrap;min-height:44px}
table.dt td{padding:12px 14px;border-top:0.5px solid var(--hairline);vertical-align:middle}
table.dt tbody tr{cursor:pointer}
table.dt tbody tr:first-child td{border-top:0}
table.dt tbody tr:hover,table.dt tbody tr:focus-visible{background:var(--surface-300)}
table.dt .r{text-align:right}
.side{display:none}
.shell{flex:1;display:flex;flex-direction:column;min-width:0}
@media (min-width:1100px){
  /* one desktop shell for everyone: sidebar on the left, a wide content area, no bottom tab bar */
  #app{max-width:1320px}
  #app.plain{max-width:560px}
  #app nav.tabs{display:flex}
  .side{display:none !important}
  .shell.hasside{display:flex}
  .side{display:flex;flex-direction:column;gap:2px;padding:20px 14px;border-right:0.5px solid var(--hairline);position:sticky;top:0;align-self:start;height:100vh;overflow:auto}
  .side .brand{font-weight:700;font-size:16px;padding:6px 10px 14px;display:flex;align-items:center;gap:8px}
  .side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);padding:16px 10px 4px}
  .side a{padding:9px 10px;border-radius:10px;font-size:14px;line-height:20px;color:var(--ink);display:flex;align-items:center;gap:10px}
  .side a:hover{background:var(--surface-300)}
  .side a.on{background:var(--brand-tint);color:var(--link);font-weight:600}
  .side a .badge{margin-left:auto;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--surface-200);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}
  #screen{padding:0 24px}
  #screen>*{width:100%;max-width:860px;margin-left:auto;margin-right:auto}
  #screen>.pd,#screen>.td,#screen>.adminmain{max-width:1120px}
  .adminmain{padding:0}
  .pd .body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
  .pd .body>.banner{grid-column:1/-1}
  #app .savebar,#app .sticky-sum{bottom:0}
  #app~.undo,body>.undo{bottom:24px;left:calc(50% + 120px)}
  .scrim{align-items:center}
  .sheet{border-radius:24px;max-width:520px}
  .adminmain .head{padding:24px 0 8px}
  .adminmain h1{font-size:32px;line-height:38px}
  .adminmain .body{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;align-items:start;padding:8px 0 24px}
  .adminmain .body>.banner,.adminmain .body>.toolbar,.adminmain .body>.dt-box,.adminmain .body>.row,.adminmain .body>.seg,.adminmain .body>.stack,.adminmain .body>.glist,.adminmain .body>.divider{grid-column:1/-1}
  .adminmain .glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;background:transparent;overflow:visible}
  .adminmain .glist .lrow{background:var(--surface-200);border-radius:18px;border-top:0}
  .adminmain .pgrid input{min-height:44px;font-size:14px}
  .adminmain .body>.gridsWrap{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;align-items:start}
  .adminmain .brandcard{padding:12px}
  .adminmain .brandcard .pgrid{grid-template-columns:54px repeat(3,minmax(0,1fr)) !important}

/* ============================================================
   PRICING ENGINE (this block moves unchanged into the app)
   Money is whole rupees. Dates are ISO text, YYYY-MM-DD.
   ============================================================ */
const Engine = (function () {
  const round500 = (n) => Math.round(n / 500) * 500;
  const makeGrid = (f) => {
    const base = { mild: [70000, 85000, 105000], moderate: [90000, 110000, 135000], severe: [120000, 145000, 180000] };
    const g = {};
    Object.keys(base).forEach((s) => { g[s] = { basic: round500(base[s][0] * f), ace: round500(base[s][1] * f), luxe: round500(base[s][2] * f) }; });
    return g;
  };
  const defaults = () => ({
    severities: { mild: "Type-A", moderate: "Type-B", severe: "Type-C" },
    packages: { basic: "Basic", ace: "Ace", luxe: "Luxe" },
    brands: {
      invisalign: { name: "Invisalign", scan: 5000, grid: makeGrid(1) },
      smile: { name: "Smile", scan: 3000, grid: makeGrid(0.75) },
      budget: { name: "Budget", scan: 2000, grid: makeGrid(0.55) }
    },
    treatments: {
      whitening: { name: "Whitening", tiers: { good: 8000, better: 12000, best: 18000 } },
      frenectomy: { name: "Frenectomy", tiers: { good: 6000, better: 9000, best: 13000 } },
      implants: { name: "Implants", tiers: { good: 45000, better: 65000, best: 85000 } },
      flap: { name: "Flap surgery", tiers: { good: 10000, better: 15000, best: 22000 } }
    },
    tierNames: { good: "Basic", better: "Ace", best: "Luxe" },
    settings: {
      validityDays: 14,
      fullPaymentPct: 3,
      productionPct: 40,
      roundStep: 100,
      emiRatePct: 12,
      emiTenures: [3, 6, 9],
      preDiscount: 5000,
      emiDownAmt: 15000,
      partProdPct: 40,
      partDelPct: 20,
      partInstPct: 15,
      partStep: 5000
    }
  });

  const EPS = 1e-9;
  const roundTo = (x, step) => Math.round(x / step) * step;
  const clone = (o) => JSON.parse(JSON.stringify(o));
  function deepFreeze(o) { Object.values(o).forEach((v) => { if (v && typeof v === "object") deepFreeze(v); }); return Object.freeze(o); }

  function group(n) {
    const s = String(Math.abs(Math.trunc(n)));
    const body = s.length <= 3 ? s : s.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ",") + "," + s.slice(-3);
    return (n < 0 ? "-" : "") + body;
  }
  const rs = (n) => "Rs " + group(n);

  function addDays(iso, n) {
    const d = new Date(iso + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }

  function alignerPrice(cfg, severity, brand, pkg) {
    if (!cfg.severities[severity]) throw new Error("Unknown severity: " + severity);
    if (!cfg.brands[brand]) throw new Error("Unknown brand: " + brand);
    if (!cfg.packages[pkg]) throw new Error("Unknown package: " + pkg);
    const v = cfg.brands[brand].grid[severity][pkg];
    if (!Number.isInteger(v) || v <= 0) throw new Error("No valid price for " + severity + ", " + brand + ", " + pkg);
    return v;
  }
  function treatmentPrice(cfg, treatment, tier) {
    if (!cfg.treatments[treatment]) throw new Error("Unknown treatment: " + treatment);
